version: '3.8'

services:
  # 1. PostgreSQL databasservice på icke-standardport (5439)
  postgres_db:
    image: postgres:15-alpine
    container_name: lagerpro-postgres
    restart: always
    environment:
      POSTGRES_USER: lager
      POSTGRES_PASSWORD: lager
      POSTGRES_DB: lagerpro
    ports:
      - "5439:5432" # Mappar lokal port 5439 på Windows till intern port 5432 i containern
    volumes:
      - pg_data:/var/lib/postgresql/data

  # 2. Adminer (Webbgränssnitt för databashantering) på icke-standardport (8089)
  db_adminer:
    image: adminer:latest
    container_name: lagerpro-adminer
    restart: always
    ports:
      - "8089:8080" # Mappar lokal port 8089 på Windows till intern port 8080 i containern
    depends_on:
      - postgres_db

volumes:
  pg_data:
    driver: local
